<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./img/Light.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sammyarts</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #120d0d;
      }

      .page-curtain {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        pointer-events: all;
      }

      .page-curtain__panel {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 25%;
        background: #120d0d;
        transform: translateY(-101%);
        transition: transform 570ms cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }

      .page-curtain__panel:nth-child(1) {
        left: 0;
      }
      .page-curtain__panel:nth-child(2) {
        left: 25%;
      }
      .page-curtain__panel:nth-child(3) {
        left: 50%;
      }
      .page-curtain__panel:nth-child(4) {
        left: 75%;
      }
      .page-curtain--closing .page-curtain__panel {
        animation: curtain-down 570ms cubic-bezier(0.76, 0, 0.24, 1) both;
      }
      .page-curtain--closing .page-curtain__panel:nth-child(2) {
        animation-delay: 80ms;
      }
      .page-curtain--closing .page-curtain__panel:nth-child(3) {
        animation-delay: 160ms;
      }
      .page-curtain--closing .page-curtain__panel:nth-child(4) {
        animation-delay: 240ms;
      }
      @keyframes curtain-down {
        from {
          transform: translateY(-101%);
        }
        to {
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-curtain__panel {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="page-curtain page-curtain--closing" aria-hidden="true">
        <div class="page-curtain__panel"></div>
        <div class="page-curtain__panel"></div>
        <div class="page-curtain__panel"></div>
        <div class="page-curtain__panel"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
