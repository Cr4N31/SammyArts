<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./img/ceo.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sammyarts</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #120d0d;
      }

      .startup-loader {
        position: fixed;
        inset: 0;
        z-index: 110;
        display: grid;
        place-items: center;
        background: #120d0d;
        color: #f5ede6;
        transition: opacity 550ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .startup-loader--exiting {
        opacity: 0;
        pointer-events: none;
      }
      .startup-loader__content {
        display: flex;
        width: min(82vw, 760px);
        flex-direction: column;
        align-items: center;
      }
      .startup-loader__wordmark {
        overflow: hidden;
        padding-bottom: 0.14em;
        font-family: Montserrat, Arial, sans-serif;
        font-size: clamp(3.5rem, 12vw, 8rem);
        letter-spacing: -0.06em;
        line-height: 0.9;
      }
      .startup-loader__letter {
        display: inline-block;
        animation: startup-letter-in 850ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--letter-index) * 55ms);
      }
      .startup-loader__letter--accent {
        color: #f78e48;
      }
      .startup-loader__caption {
        margin: 1.25rem 0 1.75rem;
        color: #b8aaa0;
        font-family: Montserrat, Arial, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
      }
      .startup-loader__track {
        width: 5rem;
        height: 1px;
        overflow: hidden;
        background: #3a2d2b;
      }
      .startup-loader__track span {
        display: block;
        width: 45%;
        height: 100%;
        background: #f78e48;
        animation: startup-progress 1.3s ease-in-out infinite;
      }
      @keyframes startup-letter-in {
        from {
          opacity: 0;
          transform: translateY(110%);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes startup-progress {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(230%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader__letter,
        .startup-loader__track span {
          animation: none !important;
        }
        .startup-loader {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-loader" role="status" aria-label="Loading SammyArts">
        <div class="startup-loader__content">
          <div class="startup-loader__wordmark" aria-label="Sammyarts">
            <span class="startup-loader__letter" style="--letter-index: 0" aria-hidden="true">S</span>
            <span class="startup-loader__letter" style="--letter-index: 1" aria-hidden="true">a</span>
            <span class="startup-loader__letter" style="--letter-index: 2" aria-hidden="true">m</span>
            <span class="startup-loader__letter" style="--letter-index: 3" aria-hidden="true">m</span>
            <span class="startup-loader__letter" style="--letter-index: 4" aria-hidden="true">y</span>
            <span class="startup-loader__letter startup-loader__letter--accent" style="--letter-index: 5" aria-hidden="true">a</span>
            <span class="startup-loader__letter startup-loader__letter--accent" style="--letter-index: 6" aria-hidden="true">r</span>
            <span class="startup-loader__letter startup-loader__letter--accent" style="--letter-index: 7" aria-hidden="true">t</span>
            <span class="startup-loader__letter startup-loader__letter--accent" style="--letter-index: 8" aria-hidden="true">s</span>
          </div>
          <p class="startup-loader__caption">Brand design · Strategy · Art direction</p>
          <div class="startup-loader__track" aria-hidden="true">
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
